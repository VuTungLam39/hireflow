# Hạ tầng dev (chạy API, FE trên máy): npm run infra:up
# Toàn hệ thống (Kickoff 22.1): docker compose up -d --build, mở http://localhost:8080
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: hireflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-ncc_intern}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hireflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Kickoff 13: object storage S3-compatible (RustFS thay MinIO)
  storage:
    image: rustfs/rustfs:1.0.3
    container_name: hireflow-storage
    restart: unless-stopped
    security_opt:
      - 'no-new-privileges:true'
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-hireflow}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-hireflow-secret}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    container_name: hireflow-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-ncc_intern}
      DATABASE_URL: ''
      DB_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ''
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hireflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-hireflow-secret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-docker-dev-secret-change-me-at-least-32-chars}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY: 1
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  web:
    build:
      context: ../fe
      args:
        PRERENDER_API_URL: ''
    container_name: hireflow-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  pgdata:
  redis_data:
  storage_data:
